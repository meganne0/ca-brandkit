<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CyberArmor — Background Recipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mozilla+Text:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/slides.css?v=87" />
      <script src="js/auth-gate.js?v=6"></script>
</head>
  <body>
    <div class="bg-gallery bg-gallery--legacy">
      <header class="bg-gallery__header">
        <h1>Background recipes</h1>
        <p>
          BG-01 … BG-12 · grouped by base. Component layers below are the files those recipes stack. Fill = cover (≥ slide W×H); swirl = full width; dots.svg stays positioned.
          <a href="index.html" style="color: var(--ca-orange)">← hub</a>
          ·
          <a href="dark-slides.html" style="color: var(--ca-orange)">Dark Slides Recipes</a>
          ·
          <a href="dark-layouts.html" style="color: var(--ca-orange)">Dark slide layouts</a>
          ·
          <a href="linkedin.html" style="color: var(--ca-orange)">LinkedIn</a>
          ·
          <a href="tokens.html" style="color: var(--ca-orange)">colors &amp; type</a>
        </p>
      </header>
      <div id="gallery"></div>
      <div id="breakdown" class="layer-catalog"></div>
      <div id="layers" class="layer-catalog"></div>
    </div>

    <dialog id="layer-dialog" class="layer-dialog" aria-labelledby="layer-dialog-title">
      <div class="layer-dialog__panel">
        <div class="layer-dialog__stage" id="layer-dialog-stage">
          <div class="layer-dialog__under" id="layer-dialog-under"></div>
          <div class="layer-dialog__art" id="layer-dialog-art"></div>
        </div>
        <div class="layer-dialog__copy">
          <button type="button" class="layer-dialog__close" id="layer-dialog-close">Close</button>
          <p class="layer-dialog__kicker" id="layer-dialog-kicker"></p>
          <h2 class="layer-dialog__title" id="layer-dialog-title"></h2>
          <p class="layer-dialog__path" id="layer-dialog-path"></p>
          <div id="layer-dialog-body"></div>
        </div>
      </div>
    </dialog>

    <script type="module">
      import { BACKGROUNDS } from "./js/backgrounds.js?v=58";
      import { LINKEDIN_BACKGROUNDS } from "./js/backgrounds-linkedin.js?v=22";
      import { YOUTUBE_BACKGROUNDS } from "./js/backgrounds-youtube.js?v=4";
      import { mountRecipePage } from "./js/recipe-gallery.js?v=14";

      const recipes = Object.fromEntries(
        Object.entries(BACKGROUNDS).filter(([id]) => id.startsWith("BG-"))
      );

      mountRecipePage({
        groups: [
          { id: "base-nodot", title: "base-nodot" },
          { id: "base-dot1", title: "base-dot1" },
          { id: "base-dot2", title: "base-dot2" },
        ],
        recipes,
        catalogGroups: [
          { channel: "slide", catalog: recipes },
          { channel: "linkedin", catalog: LINKEDIN_BACKGROUNDS },
          { channel: "youtube", catalog: YOUTUBE_BACKGROUNDS },
        ],
        slideIdTest: (id) => id.startsWith("BG-"),
      });
    </script>
  </body>
</html>
