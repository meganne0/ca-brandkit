    <script type="module">
      import { initEditableSlideBoard } from "../js/components/slide-board.js?v=31";
      import {
        refreshImageTitleLayouts,
        refreshFlowFunnels,
      } from "../js/layouts.js?v=74";
      import { enableInlineEditing } from "../js/slide-inline-edit.js?v=2";
      import { mountSlideContentForm } from "../js/slide-content-form.js?v=10";
      import {
        isPresentMode,
        openPresentTab,
        startPresentMode,
      } from "../js/present-mode.js?v=4";
      import {
        fetchDraftJson,
        persistDraftHtml,
        persistDraftJson,
      } from "../js/draft-sync.js?v=1";

      const DRAFT_FILE_KEY = "prebreach-intro";
      const STORAGE_KEY = `ca-brandkit:draft:${DRAFT_FILE_KEY}`;
      const SLIDES_JSON_URL = new URL(
        "./prebreach-intro.slides.json",
        location.href,
      ).href;

      const board = document.getElementById("board");
      const source = document.getElementById("slide-source");
      const label = document.getElementById("slide-label");
      const saveStatus = document.getElementById("save-status");
      const workspace = document.getElementById("workspace");
      const editor = document.getElementById("editor");
      const editorStage = document.getElementById("editor-stage");
      const editorPanel = document.getElementById("editor-panel");
      const lightbox = document.getElementById("slide-lightbox");
      const lightboxStage = document.getElementById("lightbox-stage");
      const lightboxLabel = document.getElementById("lightbox-label");
      const btnSave = document.getElementById("btn-save");
      const btnPreview = document.getElementById("btn-preview");
      const btnEdit = document.getElementById("btn-edit");
      const btnPresent = document.getElementById("btn-present");

      let mode = "preview";
      let index = 0;
      let disposeInline = null;
      let disposeForm = null;
      let editSlide = null;
      let editorFitObserver = null;
      let saving = false;

      function defsFromSource() {
        return [...source.querySelectorAll(".slide")].map((slide) => {
          let content = {};
          try {
            content = JSON.parse(slide.dataset.content || "{}");
          } catch {
            content = {};
          }
          return {
            title: slide.dataset.title || "",
            layout: slide.dataset.layout,
            bg: slide.dataset.bg,
            content,
          };
        });
      }

      function parseDraftPayload(raw) {
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed?.slides) || !parsed.slides.length) return null;
          return parsed;
        } catch {
          return null;
        }
      }

      /** Load browser draft; migrate legacy pathname / :vN keys once. */
      function loadSaved() {
        const primary = parseDraftPayload(localStorage.getItem(STORAGE_KEY));
        if (primary?.slides?.length) return primary;

        const path = location.pathname;
        const candidates = [];
        const seen = new Set();
        const consider = (key) => {
          if (!key || seen.has(key) || key === STORAGE_KEY) return;
          seen.add(key);
          const payload = parseDraftPayload(localStorage.getItem(key));
          if (payload) candidates.push({ key, payload });
        };

        for (let i = 0; i < localStorage.length; i += 1) {
          const key = localStorage.key(i);
          if (!key || !key.startsWith("ca-brandkit:draft:")) continue;
          if (
            key === `ca-brandkit:draft:${path}` ||
            key.startsWith(`ca-brandkit:draft:${path}:`) ||
            key.includes("prebreach-intro")
          ) {
            consider(key);
          }
        }

        if (!candidates.length) return null;

        candidates.sort((a, b) => {
          const lenDiff = b.payload.slides.length - a.payload.slides.length;
          if (lenDiff) return lenDiff;
          const aAt = Date.parse(a.payload.savedAt || 0) || 0;
          const bAt = Date.parse(b.payload.savedAt || 0) || 0;
          return bAt - aAt;
        });

        const best = candidates[0].payload;
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              ...best,
              savedAt: best.savedAt || new Date().toISOString(),
            }),
          );
        } catch {
          /* ignore quota */
        }
        return best;
      }

      function flashStatus(text, ms = 3200) {
        saveStatus.textContent = text;
        window.clearTimeout(flashStatus._t);
        flashStatus._t = window.setTimeout(() => {
          if (saveStatus.textContent === text) saveStatus.textContent = "";
        }, ms);
      }

      function persistLocal(slides = boardApi.serialize()) {
        const payload = {
          savedAt: new Date().toISOString(),
          slides,
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
          console.warn("localStorage save failed", err);
        }
        return payload;
      }

      async function resolveInitialDefs() {
        const embedded = defsFromSource();
        const remote = await fetchDraftJson(SLIDES_JSON_URL);
        const local = loadSaved();

        // After Save, browser draft must win on refresh — don't let disk JSON replace it.
        if (local?.slides?.length) return local.slides;
        if (remote?.slides?.length) return remote.slides;
        return embedded;
      }

      const slides = [];
      const boardApi = initEditableSlideBoard({
        board,
        slides,
        onOpen: handleOpen,
        onChange: (count) => {
          label.textContent = `${count} slide${count === 1 ? "" : "s"}`;
          if (mode === "edit" && index >= count) {
            selectEditSlide(Math.max(0, count - 1));
          }
        },
      });

      const initialDefs = await resolveInitialDefs();
      source.remove();
      boardApi.load(initialDefs);

      if (loadSaved()?.slides?.length) {
        flashStatus("Restored local draft", 2200);
      }

      if (isPresentMode()) {
        startPresentMode({
          slides,
          paintSlide: boardApi.paintSlide,
          fitSlide: boardApi.fitSlide,
          playSlideReveal: boardApi.playSlideReveal,
        });
      }

      async function saveDraft() {
        if (saving) return;
        saving = true;
        const payload = persistLocal();
        flashStatus("Saved — restores on refresh");

        try {
          const htmlResult = await persistDraftHtml({
            draftKey: DRAFT_FILE_KEY,
            htmlFileName: "prebreach-intro.html",
            slides: payload.slides,
            fetchHtml: async () => {
              const res = await fetch(location.pathname, { cache: "no-cache" });
              if (!res.ok) throw new Error("Could not read draft HTML");
              return res.text();
            },
          });
          const jsonResult = await persistDraftJson({
            draftKey: DRAFT_FILE_KEY,
            jsonFileName: "prebreach-intro.slides.json",
            payload,
          });

          if (htmlResult === "written" && jsonResult === "written") {
            flashStatus("Saved — restores on refresh · project files updated");
          } else if (htmlResult === "download" || jsonResult === "download") {
            flashStatus(
              "Saved — restores on refresh · downloaded files for drafts/",
              6000,
            );
          } else {
            flashStatus("Saved — restores on refresh");
          }
        } catch (err) {
          console.warn(err);
          flashStatus("Saved — restores on refresh");
        } finally {
          saving = false;
        }
      }

      function openLightbox(i) {
        if (!slides.length) return;
        index = Math.max(0, Math.min(slides.length - 1, i));
        const slide = slides[index];
        lightboxLabel.textContent = `${index + 1} / ${slides.length} · ${slide.dataset.title || ""}`;
        const clone = slide.cloneNode(true);
        lightboxStage.replaceChildren(clone);
        lightbox.hidden = false;
        document.body.classList.add("slide-lightbox-open");
        requestAnimationFrame(() => {
          boardApi.fitSlide(clone, lightboxStage);
          refreshImageTitleLayouts(clone);
          refreshFlowFunnels(clone);
          boardApi.playSlideReveal(clone);
        });
        document.getElementById("prev").disabled = index === 0;
        document.getElementById("next").disabled = index === slides.length - 1;
      }

      function clearEditor() {
        disposeInline?.();
        disposeInline = null;
        disposeForm?.();
        disposeForm = null;
        editorFitObserver?.disconnect();
        editorFitObserver = null;
        editSlide = null;
        editorStage.replaceChildren();
        editorPanel.replaceChildren();
      }

      function parseSlideContent(slide) {
        try {
          return JSON.parse(slide.dataset.content || "{}");
        } catch {
          return {};
        }
      }

      function applyEditorContent(content) {
        if (!editSlide) return;
        boardApi.updateSlideContent(index, content);
        editSlide.dataset.content = JSON.stringify(content);
        boardApi.paintSlide(editSlide);
        boardApi.fitSlide(editSlide, editorStage);
        refreshImageTitleLayouts(editSlide);
        refreshFlowFunnels(editSlide);

        window.clearTimeout(applyEditorContent._saveT);
        applyEditorContent._saveT = window.setTimeout(() => {
          persistLocal();
        }, 400);

        // Rebind inline edit after paint replaces DOM nodes
        disposeInline?.();
        disposeInline = enableInlineEditing(editSlide, {
          onCommit: (next) => {
            boardApi.updateSlideContent(index, next);
            editSlide.dataset.content = JSON.stringify(next);
            persistLocal();
            disposeForm?.();
            disposeForm = mountSlideContentForm(editorPanel, {
              layout: editSlide.dataset.layout,
              content: next,
              onChange: applyEditorContent,
            });
          },
        });
      }

      function selectEditSlide(i) {
        if (!slides.length) {
          clearEditor();
          return;
        }
        index = Math.max(0, Math.min(slides.length - 1, i));
        boardApi.setSelectedIndex(index);
        const sourceSlide = slides[index];

        disposeInline?.();
        disposeForm?.();
        editorFitObserver?.disconnect();

        const live = document.createElement("section");
        live.className = "slide";
        live.dataset.title = sourceSlide.dataset.title;
        live.dataset.layout = sourceSlide.dataset.layout;
        live.dataset.bg = sourceSlide.dataset.bg;
        live.dataset.content = sourceSlide.dataset.content;
        const layers = document.createElement("div");
        layers.className = "slide-layers";
        layers.setAttribute("aria-hidden", "true");
        live.appendChild(layers);

        editorStage.replaceChildren(live);
        editSlide = live;
        boardApi.paintSlide(live);

        const fit = () => boardApi.fitSlide(live, editorStage);
        fit();
        refreshImageTitleLayouts(live);
        refreshFlowFunnels(live);
        editorFitObserver = new ResizeObserver(() => {
          fit();
          refreshFlowFunnels(live);
        });
        editorFitObserver.observe(editorStage);

        const content = parseSlideContent(live);
        disposeForm = mountSlideContentForm(editorPanel, {
          layout: live.dataset.layout,
          content,
          onChange: applyEditorContent,
        });

        disposeInline = enableInlineEditing(live, {
          onCommit: (next) => {
            boardApi.updateSlideContent(index, next);
            live.dataset.content = JSON.stringify(next);
            disposeForm?.();
            disposeForm = mountSlideContentForm(editorPanel, {
              layout: live.dataset.layout,
              content: next,
              onChange: applyEditorContent,
            });
          },
        });
      }

      function handleOpen(i) {
        if (mode === "edit") selectEditSlide(i);
        else openLightbox(i);
      }

      function setMode(next) {
        if (mode === next) return;
        mode = next;
        workspace.dataset.mode = mode;
        btnPreview.classList.toggle("is-active", mode === "preview");
        btnEdit.classList.toggle("is-active", mode === "edit");
        editor.hidden = mode !== "edit";

        lightbox.hidden = true;
        document.body.classList.remove("slide-lightbox-open");

        if (mode === "edit") {
          boardApi.setSelectedIndex(index);
          selectEditSlide(index);
          requestAnimationFrame(() => boardApi.fitAll());
        } else {
          clearEditor();
          boardApi.setSelectedIndex(-1);
          requestAnimationFrame(() => boardApi.fitAll());
        }
      }

      btnSave.addEventListener("click", saveDraft);
      btnPreview.addEventListener("click", () => setMode("preview"));
      btnEdit.addEventListener("click", () => setMode("edit"));
      btnPresent.addEventListener("click", () => {
        openPresentTab({
          save: saveDraft,
          onBlocked: () => flashStatus("Allow pop-ups to present"),
        });
      });

      document.getElementById("prev").onclick = () => openLightbox(index - 1);
      document.getElementById("next").onclick = () => openLightbox(index + 1);
      lightbox.querySelector(".slide-lightbox__backdrop").onclick = () => {
        lightbox.hidden = true;
        document.body.classList.remove("slide-lightbox-open");
      };

      window.addEventListener("beforeunload", () => {
        try {
          persistLocal();
        } catch {
          /* ignore */
        }
      });

      window.addEventListener("keydown", (e) => {
        if (document.body.classList.contains("is-presenting")) return;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          saveDraft();
        }
        if (lightbox.hidden) return;
        if (e.key === "Escape") {
          lightbox.hidden = true;
          document.body.classList.remove("slide-lightbox-open");
        }
        if (e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          if (index < slides.length - 1) openLightbox(index + 1);
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          if (index > 0) openLightbox(index - 1);
        }
      });
    </script>
  </body>
</html>
